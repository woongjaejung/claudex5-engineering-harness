name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check shell syntax
        run: bash -n install.sh link.sh verify.sh uninstall.sh bootstrap-vps.sh scripts/common.sh tests/*.sh

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Run isolated installation tests
        env:
          CLAUDEX5_TEST_PYTHON: python3
        run: bash tests/test_install.sh

      - name: Run VPS bootstrap dry-run tests
        run: bash tests/test_bootstrap.sh

      - name: Run credential safety tests
        run: bash tests/test_verify.sh

      - name: Scan repository push candidates
        run: ./verify.sh --secrets-only --repo "$GITHUB_WORKSPACE"

      - name: Check whitespace errors
        run: git diff --check
